<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>雷区推演</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a field-survey instrument — the minefield on the left, the analyst's notebook on the right */
:root{
  --bg:#e6ebef; --surface:#f4f6f8; --raised:#ffffff; --ink:#14202b; --muted:#566473; --faint:#8592a0; --line:#d0d8df;
  --board:#cdd6de; --tile-hi:#fbfdfe; --tile-lo:#e1e8ee; --tile-edge:#a9b5c0; --tile-shine:#ffffff; --well:#edf1f4; --well-line:#d9e0e6;
  --accent:#d1661a; --accent-soft:#f6e2d0; --on-accent:#ffffff;
  --safe:#11906b; --safe-soft:#d4eee4; --danger:#d0392f; --danger-soft:#f7dbd8; --warn:#b97c0b; --warn-soft:#f4e8cc;
  --boom-ink:#ffffff; --mine-glint:#ffffff; --shadow-c:rgba(26,46,66,.20); --overlay:rgba(230,235,239,.78);
  --n1:#2160c4; --n2:#16884b; --n3:#d0362d; --n4:#4a35b0; --n5:#962a22; --n6:#0b8585; --n7:#1f2a33; --n8:#6b7785;
  --f-display:"Chakra Petch","Microsoft YaHei","PingFang SC",sans-serif;
  --f-body:"IBM Plex Sans","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r-lg:18px; --r-md:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1217; --surface:#131a21; --raised:#1b242d; --ink:#e3eaf0; --muted:#94a2af; --faint:#65717d; --line:#242f39;
    --board:#0a0f13; --tile-hi:#34424f; --tile-lo:#27323d; --tile-edge:#05080b; --tile-shine:#465767; --well:#161e26; --well-line:#1e2830;
    --accent:#f29a47; --accent-soft:#3a2818; --on-accent:#1a0f05;
    --safe:#3fc89e; --safe-soft:#11322a; --danger:#ff6a5c; --danger-soft:#3c1a18; --warn:#efb43d; --warn-soft:#382c12;
    --boom-ink:#ffffff; --mine-glint:#ffffff; --shadow-c:rgba(0,0,0,.5); --overlay:rgba(13,18,23,.8);
    --n1:#6ea8ff; --n2:#5fd38d; --n3:#ff7b6e; --n4:#b39dff; --n5:#ffa27d; --n6:#4fd6cf; --n7:#e3eaf0; --n8:#9aa7b4;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1217; --surface:#131a21; --raised:#1b242d; --ink:#e3eaf0; --muted:#94a2af; --faint:#65717d; --line:#242f39;
  --board:#0a0f13; --tile-hi:#34424f; --tile-lo:#27323d; --tile-edge:#05080b; --tile-shine:#465767; --well:#161e26; --well-line:#1e2830;
  --accent:#f29a47; --accent-soft:#3a2818; --on-accent:#1a0f05;
  --safe:#3fc89e; --safe-soft:#11322a; --danger:#ff6a5c; --danger-soft:#3c1a18; --warn:#efb43d; --warn-soft:#382c12;
  --boom-ink:#ffffff; --mine-glint:#ffffff; --shadow-c:rgba(0,0,0,.5); --overlay:rgba(13,18,23,.8);
  --n1:#6ea8ff; --n2:#5fd38d; --n3:#ff7b6e; --n4:#b39dff; --n5:#ffa27d; --n6:#4fd6cf; --n7:#e3eaf0; --n8:#9aa7b4;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 14px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
kbd{font:500 10.5px/1 var(--f-mono);padding:3px 5px;border-radius:5px;border:1px solid currentColor;opacity:.6}

.app{max-width:1340px;margin-inline:auto;padding-inline:16px;padding-block:18px 48px;display:grid;gap:16px}

/* ---------- header ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:42px;height:42px;border-radius:12px;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.brand-mark svg{width:26px;height:26px}
.brand h1{font:700 24px/1 var(--f-display);margin:0;letter-spacing:.04em}
.brand p{margin:5px 0 0;font:500 10.5px/1 var(--f-mono);letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;font-weight:500;color:var(--muted);display:flex;gap:7px;align-items:baseline;transition:background .15s,color .15s}
.seg button small{font:500 10.5px var(--f-mono);color:var(--faint)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:0 1px 4px var(--shadow-c)}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-weight:500}
.ghost:hover{color:var(--ink)}
.ghost svg{width:16px;height:16px}
.custom{display:flex;flex-wrap:wrap;align-items:end;gap:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.custom label{display:grid;gap:4px;font:500 11px/1 var(--f-mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.custom input{width:84px;padding:7px 9px;border-radius:9px;border:1px solid var(--line);background:var(--raised);font:600 15px var(--f-display)}
.custom .msg{font-size:12.5px;color:var(--muted);flex-basis:100%}

/* ---------- main layout ---------- */
.main{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:18px;align-items:start}
@media (max-width:1020px){.main{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;min-width:0;box-shadow:0 22px 50px -32px var(--shadow-c)}

.statusbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:12px}
.readout{display:flex;align-items:center;gap:10px}
.readout.right{justify-content:flex-end}
.lcd{font:700 26px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.08em;padding:7px 11px 6px;border-radius:10px;background:var(--board);min-width:74px;text-align:center}
.lcd.warn{color:var(--danger)}
.lcd-label{font:500 10px/1.25 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.newgame{display:inline-flex;align-items:center;gap:8px;padding:8px 16px 8px 10px;border-radius:999px;border:1px solid var(--line);background:var(--raised);font:600 14px/1 var(--f-display);letter-spacing:.06em;box-shadow:0 2px 0 var(--tile-edge);transition:transform .1s}
.newgame:active{transform:translateY(1px);box-shadow:0 1px 0 var(--tile-edge)}
.newgame .face{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--board);color:var(--ink)}
.newgame .face svg{width:17px;height:17px}
.newgame[data-state="won"] .face{background:var(--safe);color:var(--on-accent)}
.newgame[data-state="lost"] .face{background:var(--danger);color:var(--boom-ink)}
.mini-toggle{border:1px solid var(--line);background:var(--raised);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;color:var(--muted)}
.mini-toggle svg{width:20px;height:20px}
.mini-toggle[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.board-wrap{overflow-x:auto;overflow-y:hidden;padding-block:4px 2px}
.field{--cell:32px;--gap:4px;--axis:24px;display:grid;grid-template-columns:var(--axis) max-content;grid-template-rows:var(--axis) auto;width:max-content;margin-inline:auto}
.axis{display:grid;gap:var(--gap);font:500 10.5px/1 var(--f-mono);color:var(--faint);user-select:none;-webkit-user-select:none}
.axis-x{grid-column:2;grid-template-columns:repeat(var(--cols),var(--cell));padding-inline:10px;align-items:end;padding-bottom:5px}
.axis-y{grid-column:1;grid-row:2;grid-template-rows:repeat(var(--rows),var(--cell));padding-block:10px;justify-items:end;padding-right:6px}
.axis span{display:grid;place-items:center;border-radius:5px;transition:background .12s,color .12s;font-variant-numeric:tabular-nums}
.axis-x span{height:18px}
.axis-y span{min-width:18px;padding-inline:2px}
.axis span.five{color:var(--muted);font-weight:700}
.axis span.hover{color:var(--ink);background:var(--line)}
.axis span.on{color:var(--on-accent);background:var(--accent)}
.board{grid-column:2;grid-row:2;position:relative;display:grid;grid-template-columns:repeat(var(--cols),var(--cell));gap:var(--gap);padding:10px;background:var(--board);border-radius:14px;width:max-content;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-touch-callout:none}

/* locating a coordinate from the hint text */
.xband{position:absolute;pointer-events:none;background:color-mix(in oklab,var(--accent) 16%,transparent);border-radius:calc(var(--cell)*.24);z-index:2;animation:fade .15s ease both}
.xband.row{left:6px;right:6px;height:calc(var(--cell) + 8px);top:calc(6px + var(--r) * (var(--cell) + var(--gap)))}
.xband.col{top:6px;bottom:6px;width:calc(var(--cell) + 8px);left:calc(6px + var(--c) * (var(--cell) + var(--gap)))}
.locator{position:absolute;pointer-events:none;z-index:3;width:calc(var(--cell) + 10px);height:calc(var(--cell) + 10px);top:calc(5px + var(--r) * (var(--cell) + var(--gap)));left:calc(5px + var(--c) * (var(--cell) + var(--gap)));border:3px solid var(--accent);border-radius:calc(var(--cell)*.3);box-shadow:0 0 0 3px var(--accent-soft),0 6px 18px -4px var(--shadow-c)}
.locator::after{content:"";position:absolute;inset:-3px;border:2px solid var(--accent);border-radius:inherit;animation:ripple 1.1s ease-out infinite}
.locator::before{content:attr(data-label);position:absolute;left:50%;bottom:calc(100% + 5px);transform:translateX(-50%);white-space:nowrap;font:600 11px/1 var(--f-mono);padding:5px 7px;border-radius:6px;background:var(--accent);color:var(--on-accent)}
.locator.below::before{bottom:auto;top:calc(100% + 5px)}
.board.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}

/* ---------- cells ---------- */
.cell{width:var(--cell);height:var(--cell);border-radius:calc(var(--cell)*.2);display:grid;place-items:center;position:relative;font:700 calc(var(--cell)*.56)/1 var(--f-display)}
.cell .ico{width:64%;height:64%;display:block}
.cell.h{cursor:pointer;background:linear-gradient(180deg,var(--tile-hi),var(--tile-lo));box-shadow:inset 0 1px 0 var(--tile-shine),0 2px 0 var(--tile-edge);transition:transform .08s ease,filter .12s ease}
.cell.h:hover{filter:brightness(1.05);transform:translateY(-1px)}
.cell.h:active{transform:translateY(1px);box-shadow:inset 0 1px 0 var(--tile-shine),0 1px 0 var(--tile-edge)}
.cell.r{background:var(--well);box-shadow:inset 0 0 0 1px var(--well-line);animation:reveal .32s cubic-bezier(.2,.8,.3,1.25) both;animation-delay:var(--d,0ms)}
.cell.r[class*=" n"]{cursor:pointer}
.cell.n1{color:var(--n1)} .cell.n2{color:var(--n2)} .cell.n3{color:var(--n3)} .cell.n4{color:var(--n4)}
.cell.n5{color:var(--n5)} .cell.n6{color:var(--n6)} .cell.n7{color:var(--n7)} .cell.n8{color:var(--n8)}
.cell.f{color:var(--ink)}
.cell.f .ico{animation:plant .25s cubic-bezier(.2,.8,.3,1.4) both}
.cell.m{color:var(--ink);background:var(--well);box-shadow:inset 0 0 0 1px var(--well-line);animation:reveal .3s ease both;animation-delay:var(--d,0ms)}
.cell.boom{background:var(--danger);color:var(--boom-ink);box-shadow:0 0 0 3px var(--danger-soft);animation:boom .5s ease both}
.cell.wrong::after{content:"";position:absolute;inset:18%;background:linear-gradient(45deg,transparent 45%,var(--danger) 45%,var(--danger) 55%,transparent 55%),linear-gradient(-45deg,transparent 45%,var(--danger) 45%,var(--danger) 55%,transparent 55%)}

/* probability heat map */
.cell.heat{--heat:color-mix(in oklab,var(--danger) calc(var(--p)*100%),var(--safe));background:linear-gradient(180deg,color-mix(in oklab,var(--tile-hi) 58%,var(--heat)),color-mix(in oklab,var(--tile-lo) 52%,var(--heat)))}
.cell .pct{font:700 calc(var(--cell)*.31)/1 var(--f-mono);color:var(--ink);letter-spacing:-.04em}

/* hint highlights */
.cell.hl-safe::after,.cell.hl-mine::after,.cell.hl-guess::after,.cell.hl-src::after{content:"";position:absolute;inset:-3px;border-radius:calc(var(--cell)*.26);pointer-events:none}
.cell.hl-safe::after{border:2.5px solid var(--safe);animation:pulse 1.3s ease-in-out infinite}
.cell.hl-mine::after{border:2.5px solid var(--danger)}
.cell.hl-guess::after{border:2.5px dashed var(--warn);animation:pulse 1.3s ease-in-out infinite}
.cell.hl-src::after{border:2px solid var(--accent);background:color-mix(in oklab,var(--accent) 14%,transparent)}
.cell.hl-safe::before,.cell.hl-mine::before{content:"";position:absolute;width:30%;height:30%;border-radius:50%}
.cell.hl-safe:not(.f)::before{background:var(--safe)}
.cell.hl-mine:not(.f)::before{background:var(--danger);border-radius:2px;transform:rotate(45deg)}
.cell.heat.hl-safe::before,.cell.heat.hl-mine::before{display:none}

/* coach toast */
.toast{margin-top:12px;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--raised);font-size:13.5px;animation:rise .25s ease both}
.toast .tag{flex:none;font:600 11px/1 var(--f-mono);letter-spacing:.06em;padding:5px 7px;border-radius:6px}
.toast.danger .tag{background:var(--danger-soft);color:var(--danger)}
.toast.warn .tag{background:var(--warn-soft);color:var(--warn)}
.toast.orange .tag{background:var(--accent-soft);color:var(--accent)}
.toast.safe .tag{background:var(--safe-soft);color:var(--safe)}

.helpline{margin:12px 2px 0;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--muted)}
.helpline b{color:var(--ink);font-weight:600}

/* result overlay */
.result{position:absolute;inset:0;display:grid;place-items:center;background:var(--overlay);backdrop-filter:blur(3px);border-radius:var(--r-lg);padding:16px;z-index:5;animation:fade .3s ease both}
.result-card{width:min(420px,100%);background:var(--raised);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;box-shadow:0 30px 60px -30px var(--shadow-c);display:grid;gap:10px;animation:rise .35s cubic-bezier(.2,.8,.3,1.2) both}
.result-card .eyebrow{font:600 11px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0}
.result-card h2{font:700 30px/1.15 var(--f-display);margin:0;text-wrap:balance}
.result-card.win h2{color:var(--safe)} .result-card.lose h2{color:var(--danger)}
.result-card p{margin:0;color:var(--muted)}
.result-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:8px;margin:4px 0}
.cell.h.seen{background:linear-gradient(180deg,color-mix(in oklab,var(--danger-soft) 70%,var(--tile-hi)),var(--danger-soft));box-shadow:inset 0 0 0 1.5px color-mix(in oklab,var(--danger) 45%,transparent),0 2px 0 var(--tile-edge);cursor:default}
.cell.h.seen:hover{transform:none;filter:none}
.result-card .linkish{border:0;background:none;padding:10px 6px;color:var(--muted);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.result-card .linkish:hover{color:var(--ink)}
.result-stats div{background:var(--surface);border-radius:10px;padding:8px 10px}
.result-stats dt{font:500 10px/1.2 var(--f-mono);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.result-stats dd{margin:2px 0 0;font:700 18px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--raised);border-radius:11px;padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s,filter .15s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.badge-new{display:inline-block;font:600 11px/1 var(--f-mono);padding:5px 7px;border-radius:6px;background:var(--safe-soft);color:var(--safe);letter-spacing:.06em;justify-self:start}
canvas.confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}

/* ---------- notebook panel ---------- */
.panel{display:grid;gap:14px;min-width:0}
.tools{display:grid;grid-template-columns:1.3fr 1fr;gap:8px}
.tools .btn{padding:12px 14px;font-size:15px}
.legend{display:grid;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);font-size:12px;color:var(--muted)}
.legend .bar{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--safe),color-mix(in oklab,var(--danger) 50%,var(--safe)),var(--danger))}
.legend .ticks{display:flex;justify-content:space-between;font:500 10.5px var(--f-mono)}

.analysis{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px 18px;display:grid;gap:12px;box-shadow:0 18px 40px -30px var(--shadow-c);min-width:0}
.verdict{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{font:600 11px/1 var(--f-mono);letter-spacing:.08em;padding:6px 8px;border-radius:7px;background:var(--surface);color:var(--muted);white-space:nowrap}
.tone-safe .pill{background:var(--safe-soft);color:var(--safe)}
.tone-guess .pill{background:var(--warn-soft);color:var(--warn)}
.tone-danger .pill{background:var(--danger-soft);color:var(--danger)}
.tone-info .pill{background:var(--accent-soft);color:var(--accent)}
.verdict .vt{font:700 19px/1.25 var(--f-display);text-wrap:balance}
.prose{display:grid;gap:9px;font-size:13.5px;line-height:1.7}
.prose p{margin:0}
.prose .note{padding:8px 10px;border-radius:9px;background:var(--surface);font-size:12.5px}
.prose .note.danger{background:var(--danger-soft);color:var(--danger)}
.prose ul{margin:0;padding-left:18px;display:grid;gap:5px}
.num{display:inline-grid;place-items:center;min-width:1.55em;height:1.55em;padding:0 .2em;border-radius:5px;background:var(--well);box-shadow:inset 0 0 0 1px var(--well-line);font:700 .95em/1 var(--f-display);vertical-align:.05em}
.num.n1{color:var(--n1)} .num.n2{color:var(--n2)} .num.n3{color:var(--n3)} .num.n4{color:var(--n4)} .num.n5{color:var(--n5)} .num.n6{color:var(--n6)} .num.n7{color:var(--n7)} .num.n8{color:var(--n8)}
.coord{display:inline-flex;align-items:center;gap:4px;padding:2px 6px 2px 4px;margin-inline:1px;border-radius:5px;border:1px solid var(--line);background:var(--surface);font:600 11.5px/1.2 var(--f-mono);color:var(--ink);vertical-align:.08em;cursor:pointer;transition:border-color .12s,background .12s,color .12s;font-variant-numeric:tabular-nums}
.coord::before{content:"";width:9px;height:9px;flex:none;border-radius:2px;border:1.5px solid currentColor;opacity:.55;background:linear-gradient(currentColor,currentColor) center/1.5px 100% no-repeat,linear-gradient(currentColor,currentColor) center/100% 1.5px no-repeat}
.coord:hover,.coord:focus-visible,.coord.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.coord:hover::before,.coord.on::before{opacity:1}
.chain{list-style:none;margin:0;padding:0;display:grid;gap:6px;counter-reset:step}
.chain li{counter-increment:step;display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;padding:8px 10px;border-radius:10px;background:var(--surface);font-size:13px;line-height:1.65;cursor:default;border:1px solid transparent;transition:border-color .15s}
.chain li::before{content:counter(step);font:600 11px/20px var(--f-mono);text-align:center;width:20px;height:20px;margin-top:2px;border-radius:50%;background:var(--ink);color:var(--bg)}
.chain li.final{border-color:var(--safe)}
.chain li.final::before{background:var(--safe);color:var(--on-accent)}
.chain li:hover{border-color:var(--accent)}
.hint-tip{font-size:12px;color:var(--muted)}

.section{display:grid;gap:10px;padding:14px 4px 4px;border-top:1px solid var(--line)}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.section h3{margin:0;font:600 12px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);cursor:pointer}
.switch input{appearance:none;width:34px;height:20px;border-radius:999px;background:var(--board);position:relative;cursor:pointer;margin:0;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--raised);box-shadow:0 1px 2px var(--shadow-c);transition:transform .15s}
.switch input:checked{background:var(--accent)}

.summary{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--f-body);padding:6px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.chip b{font:700 13px/1 var(--f-display)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.dot.safe{background:var(--safe)} .dot.warn{background:var(--warn)} .dot.orange{background:var(--accent)} .dot.danger{background:var(--danger)}

.log .c{justify-self:start}
.log .p{font:700 13px var(--f-display);text-align:right}
.log .k{display:flex;align-items:center;gap:6px;justify-content:flex-end;color:var(--muted)}

.patterns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.pattern h4{margin:0;font:700 14px/1 var(--f-display);letter-spacing:.04em}
.pattern p{margin:0;font-size:12px;line-height:1.55;color:var(--muted)}
.pgrid{--cell:20px;display:grid;grid-template-columns:repeat(var(--cols),var(--cell));gap:3px;padding:5px;background:var(--board);border-radius:8px;width:max-content}

<script>
(() => {
'use strict';

const $ = s => document.querySelector(s);
const PRESETS = {
  easy:   { rows: 9,  cols: 9,  mines: 10, name: '初级' },
  medium: { rows: 16, cols: 16, mines: 40, name: '中级' },
  hard:   { rows: 16, cols: 30, mines: 99, name: '高级' },
};
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

const MINE_SVG = '<svg class="ico" viewBox="0 0 24 24"><g stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 2.5v3.6M12 17.9v3.6M2.5 12h3.6M17.9 12h3.6M5.3 5.3l2.5 2.5M16.2 16.2l2.5 2.5M18.7 5.3l-2.5 2.5M7.8 16.2l-2.5 2.5"/></g><circle cx="12" cy="12" r="5.8" fill="currentColor"/><circle cx="10.2" cy="10.2" r="1.5" fill="var(--mine-glint)" opacity=".85"/></svg>';
const FLAG_SVG = '<svg class="ico" viewBox="0 0 24 24"><path d="M7 3v18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M8 4h10.5l-3 4.2 3 4.3H8z" fill="var(--accent)"/><path d="M4.5 21h6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
const FACE = {
  ready: MINE_SVG,
  playing: MINE_SVG,
  won: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  lost: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>',
};

/* ==========================================================================
   概率求解器 Solver
   输入只有「玩家看得到的东西」：每个已翻开格子的数字（未翻开 = -1）和总雷数。
   它从不读取雷的真实位置，也不信任玩家插的旗（旗可能插错）。
   1) 规则推理：单格规则 + 两两比较（子集 / 1-2 类定式），记录每一步推理链
   2) 精确枚举：对剩余边界按连通块回溯枚举所有合法布局，
      再结合剩余雷数用组合数 C(内部格数, 剩余雷数) 加权，得到每格精确概率
   ========================================================================== */
const Solver = (() => {
  const nbCache = new Map();
  function neighbors(rows, cols) {
    const key = rows + 'x' + cols;
    if (nbCache.has(key)) return nbCache.get(key);
    const out = new Array(rows * cols);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const a = [];
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        if (!dr && !dc) continue;
        const rr = r + dr, cc = c + dc;
        if (rr >= 0 && rr < rows && cc >= 0 && cc < cols) a.push(rr * cols + cc);
      }
      out[r * cols + c] = a;
    }
    nbCache.set(key, out);
    return out;
  }

  const LF = [0];
  const lf = n => { while (LF.length <= n) LF.push(LF[LF.length - 1] + Math.log(LF.length)); return LF[n]; };
  const logC = (n, k) => (k < 0 || k > n) ? -Infinity : lf(n) - lf(k) - lf(n - k);

  function analyze(view, opt = {}) {
    const t0 = performance.now();
    const { rows, cols, total, grid } = view;
    const N = rows * cols, nb = neighbors(rows, cols);
    const LIMIT = opt.budget || 2500000;

    const known = new Int8Array(N).fill(-1); // -1 未定, 0 推出安全, 1 推出是雷
    const unknown = [];
    // grid: -1 = 未翻开；-2 = 玩家踩过、亲眼看到的雷（返回上一步后保留），直接当作已知的雷
    for (let i = 0; i < N; i++) if (grid[i] < 0) { unknown.push(i); if (grid[i] === -2) known[i] = 1; }

    // 每个带未知邻居的数字 = 一条约束
    const cons = [], cellCons = Array.from({ length: N }, () => []);
    for (let i = 0; i < N; i++) {
      if (grid[i] < 0) continue;
      const cells = nb[i].filter(j => grid[j] < 0);
      if (!cells.length) continue;
      const id = cons.length;
      cons.push({ src: i, num: grid[i], cells });
      for (const j of cells) cellCons[j].push(id);
    }
    const stat = c => {
      let m = 0; const unk = [], kn = [], km = [];
      for (const j of c.cells) {
        if (known[j] === -1) unk.push(j);
        else { kn.push(j); if (known[j] === 1) { m++; km.push(j); } }
      }
      return { rem: c.num - m, unk, kn, km, m };
    };

    // ---------- 1. 规则推理 ----------
    const steps = [], stepOf = new Int32Array(N).fill(-1);
    const commit = s => {
      const id = steps.length;
      for (const j of s.mines) { known[j] = 1; stepOf[j] = id; }
      for (const j of s.safes) { known[j] = 0; stepOf[j] = id; }
      steps.push(s);
    };
    let contradiction = false;
    for (let guard = 0, progress = true; progress && !contradiction && guard < 5000; guard++) {
      progress = false;
      for (const c of cons) {
        const s = stat(c);
        if (!s.unk.length) { if (s.rem !== 0) contradiction = true; continue; }
        if (s.rem < 0 || s.rem > s.unk.length) { contradiction = true; continue; }
        if (s.rem === 0) {
          commit({ kind: 'single', val: 0, srcs: [c.src], num: c.num, knownMines: s.m, mines: [], safes: s.unk, uses: s.km });
          progress = true;
        } else if (s.rem === s.unk.length) {
          commit({ kind: 'single', val: 1, srcs: [c.src], num: c.num, knownMines: s.m, rem: s.rem, mines: s.unk, safes: [], uses: s.kn });
          progress = true;
        }
      }
      if (progress || contradiction) continue;
      // 两两比较：A 比 B 多需要的雷 = A 独有格子数 ⇒ A 独有全是雷，B 独有全安全
      outer:
      for (let a = 0; a < cons.length; a++) {
        const sa = stat(cons[a]);
        if (!sa.unk.length) continue;
        const setA = new Set(sa.unk), seen = new Set();
        for (const j of sa.unk) for (const b of cellCons[j]) {
          if (b === a || seen.has(b)) continue;
          seen.add(b);
          const sb = stat(cons[b]);
          if (!sb.unk.length) continue;
          const setB = new Set(sb.unk);
          const onlyA = sa.unk.filter(x => !setB.has(x));
          const onlyB = sb.unk.filter(x => !setA.has(x));
          if (!onlyA.length && !onlyB.length) continue;
          if (sa.rem - sb.rem === onlyA.length) {
            commit({
              kind: 'pair', srcs: [cons[a].src, cons[b].src], numA: cons[a].num, numB: cons[b].num,
              remA: sa.rem, remB: sb.rem, shared: sa.unk.length - onlyA.length, onlyA, onlyB,
              mines: onlyA, safes: onlyB, uses: [...new Set([...sa.kn, ...sb.kn])],
            });
            progress = true;
            break outer;
          }
        }
      }
    }

    // ---------- 2. 精确枚举 ----------
    const red = [];
    for (const c of cons) {
      const s = stat(c);
      if (s.unk.length) red.push({ src: c.src, rem: s.rem, cells: s.unk });
    }
    const isFront = new Uint8Array(N);
    const cellRed = new Map();
    red.forEach((r, ri) => r.cells.forEach(j => {
      isFront[j] = 1;
      if (!cellRed.has(j)) cellRed.set(j, []);
      cellRed.get(j).push(ri);
    }));
    let fixedMines = 0;
    for (const i of unknown) if (known[i] === 1) fixedMines++;
    const others = unknown.filter(i => known[i] === -1 && !isFront[i]);
    const nO = others.length;
    const M = total - fixedMines;

    // 连通块：共享格子的约束属于同一块
    const comps = [], compOf = new Int32Array(N).fill(-1), redComp = new Int32Array(red.length).fill(-1);
    for (let r0 = 0; r0 < red.length; r0++) {
      if (redComp[r0] >= 0) continue;
      const ci = comps.length, q = [r0], cells = [], consIdx = [];
      redComp[r0] = ci;
      for (let h = 0; h < q.length; h++) {
        const ri = q[h]; consIdx.push(ri);
        for (const j of red[ri].cells) {
          if (compOf[j] < 0) { compOf[j] = ci; cells.push(j); }
          for (const rj of cellRed.get(j)) if (redComp[rj] < 0) { redComp[rj] = ci; q.push(rj); }
        }
      }
      comps.push({ cells, consIdx, srcs: consIdx.map(ri => red[ri].src) });
    }

    // 每个连通块用「边界状态动态规划」精确计数（前向 + 后向），
    // 得到：该块放 k 个雷的布局数 ways[k]，以及每个格子在这些布局中是雷的次数 hits[k][t]
    let workLeft = LIMIT * 12, approx = false;
    for (const comp of comps) {
      const cc = comp.consIdx.map(ri => red[ri]), nc = cc.length;
      // 选一个让「同时活跃的约束」最少的格子顺序
      const orders = [comp.cells.slice(), comp.cells.slice().sort((a, b) => a - b), comp.cells.slice().sort((a, b) => (a % cols) - (b % cols) || a - b)];
      let ord = orders[0], bestWidth = Infinity;
      for (const o of orders) {
        const at = new Map(o.map((c, k) => [c, k])), cnt = new Int32Array(o.length + 2);
        for (const r of cc) {
          let f = Infinity, l = -1;
          for (const j of r.cells) { const x = at.get(j); if (x < f) f = x; if (x > l) l = x; }
          cnt[f + 1]++; cnt[l + 1]--;
        }
        let w = 0, run = 0;
        for (let b = 0; b < cnt.length; b++) { run += cnt[b]; if (run > w) w = run; }
        if (w < bestWidth) { bestWidth = w; ord = o; }
      }
      comp.cells = ord;
      const n = ord.length, at = new Map(ord.map((c, k) => [c, k]));
      const need = new Int32Array(nc), first = new Int32Array(nc), last = new Int32Array(nc);
      const cellQ = Array.from({ length: n }, () => []);
      cc.forEach((r, q) => {
        need[q] = r.rem; first[q] = n; last[q] = -1;
        for (const j of r.cells) { const x = at.get(j); cellQ[x].push(q); if (x < first[q]) first[q] = x; if (x > last[q]) last[q] = x; }
      });
      // 每个格子赋值后，它所在约束在后面还剩几个格子
      const remAfter = cellQ.map((qs, b) => qs.map(q => cc[q].cells.reduce((s, j) => s + (at.get(j) > b ? 1 : 0), 0)));
      // 边界 b 上活跃的约束：first < b <= last
      const active = Array.from({ length: n + 1 }, (_, b) => { const a = []; for (let q = 0; q < nc; q++) if (first[q] < b && b <= last[q]) a.push(q); return a; });
      const maxK = Math.max(0, Math.min(n, M));
      const F = new Array(n + 1);
      const w0 = new Float64Array(maxK + 1); w0[0] = 1;
      F[0] = [{ s: [], w: w0, tr: [null, null] }];
      const posB = new Int32Array(nc).fill(-1), inCell = new Uint8Array(nc);
      let aborted = false;
      for (let b = 0; b < n && !aborted; b++) {
        posB.fill(-1); active[b].forEach((q, p) => { posB[q] = p; });
        inCell.fill(0); cellQ[b].forEach(q => { inCell[q] = 1; });
        const nextMap = new Map(), A1 = active[b + 1];
        for (const st of F[b]) {
          for (let v = 0; v <= 1; v++) {
            let ok = true;
            for (let t = 0; t < cellQ[b].length; t++) {
              const q = cellQ[b][t], s = (posB[q] >= 0 ? st.s[posB[q]] : 0) + v;
              if (s > need[q] || s + remAfter[b][t] < need[q]) { ok = false; break; }
            }
            if (!ok) continue;
            const ns = A1.map(q => (posB[q] >= 0 ? st.s[posB[q]] : 0) + (inCell[q] ? v : 0));
            const key = ns.join(',');
            let e = nextMap.get(key);
            if (!e) { e = { s: ns, w: new Float64Array(maxK + 1), tr: [null, null] }; nextMap.set(key, e); }
            for (let k = 0; k + v <= maxK; k++) if (st.w[k]) e.w[k + v] += st.w[k];
            st.tr[v] = e;
          }
        }
        F[b + 1] = [...nextMap.values()];
        workLeft -= F[b + 1].length * (maxK + 1);
        if (F[b + 1].length > 60000 || workLeft < 0) aborted = true;
      }
      if (!aborted) {
        // 后向：g[k] = 从该状态往后填完、恰好再放 k 个雷的方式数
        for (const st of F[n]) { st.g = new Float64Array(maxK + 1); st.g[0] = 1; }
        for (let b = n - 1; b >= 0; b--) for (const st of F[b]) {
          const g = new Float64Array(maxK + 1);
          for (let v = 0; v <= 1; v++) { const e = st.tr[v]; if (!e) continue; for (let k = 0; k + v <= maxK; k++) if (e.g[k]) g[k + v] += e.g[k]; }
          st.g = g;
        }
        const ways = new Float64Array(maxK + 1);
        for (const st of F[n]) for (let k = 0; k <= maxK; k++) ways[k] += st.w[k];
        const hits = Array.from({ length: maxK + 1 }, () => new Float64Array(n));
        for (let b = 0; b < n; b++) for (const st of F[b]) {
          const e = st.tr[1]; if (!e) continue;
          for (let k1 = 0; k1 <= maxK; k1++) {
            const a = st.w[k1]; if (!a) continue;
            for (let k2 = 0; k1 + 1 + k2 <= maxK; k2++) if (e.g[k2]) hits[k1 + 1 + k2][b] += a * e.g[k2];
          }
        }
        comp.total = ways.reduce((x, y) => x + y, 0);
        // 每块按自身最大值缩放，避免多块相乘时溢出（常数因子在概率比值里会抵消）
        let sc = 0; for (const x of ways) if (x > sc) sc = x;
        if (sc > 0) { for (let k = 0; k <= maxK; k++) { ways[k] /= sc; const h = hits[k]; for (let t = 0; t < n; t++) h[t] /= sc; } }
        comp.ways = ways; comp.hits = hits;
      } else {
        // 状态数爆炸时退化为迭代比例拟合的近似值
        approx = comp.approx = true;
        const p = new Float64Array(n).fill(0.5);
        for (let it = 0; it < 60; it++) {
          for (let q = 0; q < nc; q++) {
            let s = 0; const idx = cc[q].cells.map(j => at.get(j));
            for (const t of idx) s += p[t];
            if (s <= 0) continue;
            const f = need[q] / s;
            for (const t of idx) p[t] = Math.min(0.999, Math.max(0.001, p[t] * f));
          }
        }
        let e = 0; for (const v of p) e += v;
        const k = Math.max(0, Math.min(maxK, Math.round(e)));
        comp.ways = new Float64Array(maxK + 1); comp.ways[k] = 1;
        comp.hits = []; comp.hits[k] = p;
        comp.total = NaN;
      }
    }

    // ---------- 3. 结合剩余雷数加权合并 ----------
    const conv = (a, b) => {
      const r = new Float64Array(Math.min(a.length + b.length - 1, M + 1));
      for (let i = 0; i < a.length; i++) if (a[i]) for (let j = 0; j < b.length && i + j <= M; j++) if (b[j]) r[i + j] += a[i] * b[j];
      return r;
    };
    const one = new Float64Array([1]);
    const prefix = [one];
    for (const c of comps) prefix.push(conv(prefix[prefix.length - 1], c.ways));
    const suffix = new Array(comps.length + 1); suffix[comps.length] = one;
    for (let i = comps.length - 1; i >= 0; i--) suffix[i] = conv(comps[i].ways, suffix[i + 1]);
    const full = prefix[comps.length];
    const lw = K => logC(nO, M - K);
    let maxL = -Infinity;
    for (let K = 0; K < full.length; K++) if (full[K] > 0) maxL = Math.max(maxL, lw(K));
    const wK = K => { const l = lw(K); return l === -Infinity ? 0 : Math.exp(l - maxL); };
    let Tot = 0, otherNum = 0;
    for (let K = 0; K < full.length; K++) if (full[K] > 0) {
      const w = full[K] * wK(K);
      Tot += w; otherNum += nO ? w * (M - K) / nO : 0;
    }
    if (!(Tot > 0)) contradiction = true;

    const prob = new Float64Array(N).fill(NaN);
    for (const i of unknown) if (known[i] >= 0) prob[i] = known[i];
    const pOther = (nO && Tot > 0) ? otherNum / Tot : NaN;
    for (const i of others) prob[i] = pOther;
    comps.forEach((comp, ci) => {
      const rest = conv(prefix[ci], suffix[ci + 1]);
      const W = new Float64Array(comp.ways.length);
      for (let k = 0; k < W.length; k++) {
        if (!comp.ways[k]) continue;
        let s = 0;
        for (let R = 0; R < rest.length; R++) if (rest[R] && k + R <= M) s += rest[R] * wK(k + R);
        W[k] = s;
      }
      const n = comp.cells.length, acc = new Float64Array(n);
      for (let k = 0; k < W.length; k++) {
        if (!W[k] || !comp.hits[k]) continue;
        const h = comp.hits[k];
        for (let t = 0; t < n; t++) acc[t] += h[t] * W[k];
      }
      comp.cells.forEach((c, t) => { prob[c] = Tot > 0 ? acc[t] / Tot : NaN; });
    });
    for (const i of unknown) {
      if (prob[i] < 1e-9) prob[i] = 0;
      else if (prob[i] > 1 - 1e-9) prob[i] = 1;
    }

    const safeAll = unknown.filter(i => prob[i] === 0);
    const mineAll = unknown.filter(i => prob[i] === 1);
    const enumSafe = safeAll.filter(i => known[i] !== 0);
    const enumMine = mineAll.filter(i => known[i] !== 1);
    let minP = 1;
    for (const i of unknown) if (prob[i] < minP) minP = prob[i];

    return {
      prob, steps, stepOf, known, comps, compOf, others, nO, pOther, M, fixedMines, total,
      safeAll, mineAll, enumSafe, enumMine, minP, unknown, approx, contradiction, rows, cols, grid,
      ms: performance.now() - t0,
    };
  }

  return { analyze, neighbors };
})();

/* ==========================================================================
   Game state
   ========================================================================== */
const S = {
  diff: 'medium', rows: 16, cols: 16, mines: 40,
  mine: null, adj: null, st: null,          // st: 0 未翻开, 1 已翻开, 2 插旗
  state: 'ready', revealed: 0, flags: 0,
  t0: 0, elapsed: 0, hints: 0,
  flagMode: false, heat: false, coach: LS.get('ms-coach', true),
  log: [], ver: 0, anaVer: -1, analysis: null,
  hl: null, hlTemp: null, explodedAt: -1, lastEval: null, card: null,
  hintOpen: false, preCard: null,             // 提示是否展开 + 展开前分析台显示的内容
  prev: null,                                 // 上一步之前的盘面快照，用于踩雷后返回
  booms: [], seen: new Set(), revealAll: false, undos: 0,   // 踩中的雷 / 返回后已确认的雷 / 是否已揭晓全部雷 / 返回次数
  custom: LS.get('ms-custom', { rows: 20, cols: 24, mines: 90 }),

let els = [], keys = [], timerId = 0, toastTimer = 0;
const delays = new Map();
const nbr = () => Solver.neighbors(S.rows, S.cols);
const rc = i => [Math.floor(i / S.cols) + 1, i % S.cols + 1];
const pos = i => { const [r, c] = rc(i); return `<button type="button" class="coord" data-cell="${i}" title="第 ${r} 行，第 ${c} 列：悬停在棋盘上定位，点击滚动过去">${r},${c}</button>`; };
const numTag = n => `<b class="num n${n}">${n}</b>`;
const pct = p => {
  if (!(p >= 0)) return '—';
  if (p === 0) return '0%';
  if (p === 1) return '100%';
  const v = p * 100;
  return (v < 1 ? v.toFixed(2) : v < 10 ? v.toFixed(1) : v.toFixed(0)) + '%';
};
const fmtBig = n => {
  if (!isFinite(n)) return '很多';
  if (n < 1e6) return Math.round(n).toLocaleString('zh-CN');
  const e = Math.floor(Math.log10(n));
  return (n / 10 ** e).toFixed(1) + '×10<sup>' + e + '</sup>';

/* 只导出玩家屏幕上看得到的信息 —— 求解器唯一的输入 */
function buildView() {
  const N = S.rows * S.cols, grid = new Int8Array(N);
  for (let i = 0; i < N; i++) grid[i] = S.st[i] === 1 ? S.adj[i] : S.seen.has(i) ? -2 : -1;
  return { rows: S.rows, cols: S.cols, total: S.mines, grid };
}
function getAnalysis() {
  if (S.anaVer !== S.ver || !S.analysis) {
    S.analysis = Solver.analyze(buildView());
    S.anaVer = S.ver;
  }
  return S.analysis;
}

function statsKey() {
  return S.diff === 'custom' ? `ms-stats-custom-${S.rows}x${S.cols}-${S.mines}` : `ms-stats-${S.diff}`;
}

/* ---------- lifecycle ---------- */
function newGame(diff = S.diff, cfg) {
  const p = diff === 'custom' ? (cfg || S.custom) : PRESETS[diff];
  S.diff = diff; S.rows = p.rows; S.cols = p.cols; S.mines = p.mines;
  const N = S.rows * S.cols;
  S.mine = new Uint8Array(N); S.adj = new Uint8Array(N); S.st = new Uint8Array(N);
  stopTimer();
  Object.assign(S, { state: 'ready', revealed: 0, flags: 0, elapsed: 0, hints: 0, log: [], analysis: null, anaVer: -1, hl: null, hlTemp: null, explodedAt: -1, lastEval: null, hintOpen: false, preCard: null, prev: null, booms: [], seen: new Set(), revealAll: false, undos: 0 });
  S.ver++;
  LS.set('ms-diff', diff);
  hideResult(); clearToast();
  buildBoard();
  setCard(defaultCard());
  renderAll();
}

function placeMines(first) {
  const N = S.rows * S.cols, nb = nbr();
  const ban = new Set([first]);
  if (N - S.mines >= 9) nb[first].forEach(j => ban.add(j));
  const cand = [];
  for (let i = 0; i < N; i++) if (!ban.has(i)) cand.push(i);
  for (let k = 0; k < S.mines; k++) {
    const r = k + Math.floor(Math.random() * (cand.length - k));
    [cand[k], cand[r]] = [cand[r], cand[k]];
    S.mine[cand[k]] = 1;
  }
  for (let i = 0; i < N; i++) { let a = 0; for (const j of nb[i]) a += S.mine[j]; S.adj[i] = a; }
}

function openCells(list) {
  const nb = nbr(), booms = [], q = [];
  for (const i of list) {
    if (S.st[i] !== 0) continue;
    if (S.mine[i]) { booms.push(i); continue; }
    S.st[i] = 1; S.revealed++; delays.set(i, 0); q.push([i, 0]);
  }
  for (let h = 0; h < q.length; h++) {
    const [i, d] = q[h];
    if (S.adj[i] !== 0) continue;
    for (const j of nb[i]) {
      if (S.st[j] !== 0 || S.mine[j]) continue;
      S.st[j] = 1; S.revealed++;
      delays.set(j, Math.min((d + 1) * 24, 650));
      q.push([j, d + 1]);
    }
  }
  return booms;
}

function evaluate(targets) {
  const A = getAnalysis();
  if (!A || A.contradiction) return { kind: 'na', cell: targets[0], p: null };
  let p = -1, cell = targets[0];
  for (const t of targets) if (A.prob[t] > p) { p = A.prob[t]; cell = t; }
  const safeN = A.safeAll.length;
  let kind;
  if (p === 0) kind = 'safe';
  else if (safeN > 0) kind = 'risky';
  else if (p <= A.minP + 0.02) kind = 'forced';
  else kind = 'subopt';
  return { kind, p, cell, minP: A.minP, safeN, approx: A.approx };
}

function doMove(targets) {
  if (S.state === 'won' || S.state === 'lost') return;
  targets = targets.filter(i => S.st[i] === 0);
  if (!targets.length) return;
  let ev;
  if (S.state === 'ready') {
    placeMines(targets[0]);
    S.state = 'playing'; startTimer();
    ev = { kind: 'first', p: 0, cell: targets[0] };
  } else {
    ev = evaluate(targets);
  }
  // 记下这一步之前的盘面，踩雷后可以返回
  S.prev = { st: S.st.slice(), revealed: S.revealed, flags: S.flags, lastEval: S.lastEval };
  const booms = openCells(targets);
  // 盘面变了，展开中的提示已过期：收起并恢复到点提示之前的样子
  const wasHint = S.hintOpen, preCard = S.preCard;
  S.hintOpen = false; S.preCard = null; unlocate();
  S.ver++; S.hl = null; S.hlTemp = null; S.lastEval = ev;
  S.log.push({ n: S.log.length + 1, ...ev });
  if (booms.length) lose(booms);
  else if (S.revealed === S.rows * S.cols - S.mines) win();
  else {
    if (S.coach) coachToast(ev); else clearToast();
    if (wasHint) setCard(preCard || defaultCard());
  }
  renderAll();
}

function reveal(i) { doMove([i]); }
function chord(i) {
  if (S.state !== 'playing' || S.st[i] !== 1 || !S.adj[i]) return;
  const nb = nbr()[i];
  const f = nb.filter(j => S.st[j] === 2).length;
  if (f !== S.adj[i]) { flashCells(nb.filter(j => S.st[j] === 0)); return; }
  doMove(nb.filter(j => S.st[j] === 0));
}
function toggleFlag(i) {
  if (S.state === 'won' || S.state === 'lost' || S.st[i] === 1 || S.seen.has(i)) return;
  if (S.st[i] === 2) { S.st[i] = 0; S.flags--; } else { S.st[i] = 2; S.flags++; }
  S.hlTemp = null;
  renderBoard(); renderStatus();
}
function flashCells(list) {
  for (const j of list) {
    const el = els[j]; if (!el) continue;
    el.animate([{ filter: 'brightness(1)' }, { filter: 'brightness(.8)' }, { filter: 'brightness(1)' }], { duration: 260 });
  }
}

function win() {
  S.state = 'won'; stopTimer();
  for (let i = 0; i < S.mine.length; i++) if (S.mine[i] && S.st[i] !== 2) S.st[i] = 2;
  S.flags = S.mines;
  const k = statsKey(), st = LS.get(k, { played: 0, won: 0, best: null });
  st.played++; st.won++;
  // 用过「返回上一步」的局算胜场，但不参与最佳用时
  const isBest = !S.undos && (st.best == null || S.elapsed < st.best);
  if (isBest) st.best = S.elapsed;
  LS.set(k, st);
  clearToast();
  setCard({ tone: 'safe', pill: '通关', title: '雷区已清空', html: `<p>本局用时 ${S.elapsed.toFixed(1)} 秒，使用提示 ${S.hints} 次${S.undos ? `，返回上一步 ${S.undos} 次（不计入最佳用时）` : ''}。看看下面的决策记录：绿色越多，说明你越多地靠推理而不是运气。</p>` });
  showResult('win', isBest);
  confetti();
}
/* 踩雷：只显示踩中的雷。其余雷要等玩家选择「揭晓全部雷」才显示，揭晓后不能再返回 */
function lose(booms) {
  S.state = 'lost'; S.booms = booms; S.explodedAt = booms[0]; S.revealAll = false; stopTimer();
  const k = statsKey(), st = LS.get(k, { played: 0, won: 0, best: null });
  st.played++; LS.set(k, st);
  const b = $('#board'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
  clearToast();
  setCard(loseCard());
  showResult('lose');
}
const canUndo = () => S.state === 'lost' && !!S.prev && !S.revealAll;
function loseCard() {
  const ev = S.lastEval;
  const html = `<p>${loseReview(ev)}</p>` + (canUndo()
    ? `<div class="row"><button type="button" class="btn primary" data-act="undo">返回上一步 <kbd>Z</kbd></button><button type="button" class="btn" data-act="reveal">揭晓全部雷</button></div>
       <p class="hint-tip">返回后，踩中的格子会插上旗、标为「已确认的雷」，求解器也会把它当作已知的雷。其他雷的位置不会显示。揭晓全部雷之后就不能再返回。</p>`
    : `<div class="row"><button type="button" class="btn primary" data-act="again">再来一局 <kbd>N</kbd></button></div>`);
  return { tone: 'danger', pill: '踩雷', title: canUndo() ? '可以返回上一步' : '这一局结束了', html };
}
function revealMines() {
  if (S.state !== 'lost' || S.revealAll) return;
  S.revealAll = true;
  const r0 = Math.floor(S.explodedAt / S.cols), c0 = S.explodedAt % S.cols;
  for (let j = 0; j < S.mine.length; j++) if (S.mine[j] && !S.booms.includes(j)) {
    const d = Math.hypot(Math.floor(j / S.cols) - r0, j % S.cols - c0);
    delays.set(j, Math.min(80 + d * 40, 1200));
  }
  hideResult();
  setCard(loseCard());
  renderBoard();
}
function undo() {
  if (!canUndo()) return;
  const p = S.prev;
  S.st = p.st; S.revealed = p.revealed; S.flags = p.flags;
  // 踩中的雷玩家已经亲眼看到：插旗并记为已确认
  for (const b of S.booms) { if (S.st[b] !== 2) { S.st[b] = 2; S.flags++; } S.seen.add(b); }

  setCard({
    tone: 'info', pill: '已返回', title: '回到了踩雷之前',
    html: `<p>${hit.map(pos).join('、')} 是雷，已经插上旗并标为已确认（红底）。求解器会把它当作已知的雷，提示和概率图都已经算上这条信息。</p>
      <p class="hint-tip">换一个选择。卡住时按 H 看看现在哪里更安全。这局用了返回，赢了也不计入最佳用时。</p>`,
  });

function loseReview(ev) {
  if (!ev) return '';
  if (ev.kind === 'risky') return `这一步的雷率是 ${pct(ev.p)}，而当时盘面上还有 ${ev.safeN} 个 100% 安全的格子。下次卡住时点「提示」，看看它们是怎么推出来的。`;
  if (ev.kind === 'subopt') return `这一步的雷率是 ${pct(ev.p)}，当时风险最低的格子只有 ${pct(ev.minP)}。打开概率图，练习比较不同位置的风险。`;
  if (ev.kind === 'forced') return `当时没有能确定安全的格子，这一步雷率 ${pct(ev.p)}，已经是全盘最低的选择。这种猜测在扫雷里无法避免。`;
  return '再来一局吧。';
}

/* ---------- timer ---------- */
function startTimer() {
  S.t0 = performance.now() - S.elapsed * 1000;
  clearInterval(timerId);
  timerId = setInterval(() => { S.elapsed = (performance.now() - S.t0) / 1000; renderTimer(); }, 200);
}
function stopTimer() {
  if (timerId) { S.elapsed = (performance.now() - S.t0) / 1000; clearInterval(timerId); timerId = 0; }
}

/* ==========================================================================
   Hints
   ========================================================================== */
function chainFor(A, idx) {
  const need = new Set(), stack = [idx];
  while (stack.length) {
    const s = stack.pop();
    if (need.has(s)) continue;
    need.add(s);
    for (const j of A.steps[s].uses) { const t = A.stepOf[j]; if (t >= 0 && !need.has(t)) stack.push(t); }
  }
  return [...need].sort((a, b) => a - b);
}

function describeStep(s) {
  if (s.kind === 'single') {
    const src = s.srcs[0];
    const them = s.mines.length === 1 ? '这一格就是雷' : '它们全是雷';
    if (s.val === 0) {
      const rest = s.safes.length === 1 ? '剩下的那 1 个未翻开格子安全' : `剩下的 ${s.safes.length} 个未翻开格子都安全`;
      return `${numTag(s.num)} ${pos(src)}：${s.num === 0 ? '它周围没有雷' : `周围的 ${s.num} 个雷已经全部确定${s.knownMines ? '（来自前面的推理）' : ''}`}，所以${rest}。`;
    }
    if (!s.knownMines) return `${numTag(s.num)} ${pos(src)}：周围只剩 ${s.mines.length} 个可能放雷的格子，正好需要 ${s.num} 个雷，所以${them}。`;
    return `${numTag(s.num)} ${pos(src)}：已经确定 ${s.knownMines} 个雷，还差 ${s.rem} 个；可能放雷的格子也只剩 ${s.mines.length} 个，所以${them}。`;
  }
  const [a, b] = s.srcs, A = `${numTag(s.numA)} ${pos(a)}`, B = `${numTag(s.numB)} ${pos(b)}`;
  const d = s.remA - s.remB;
  if (!s.onlyA.length) {
    return `${A} 还需要 ${s.remA} 个雷，它剩下的未知格全都在 ${B} 的范围里。${B} 也只需要 ${s.remB} 个，雷全部落在共同区域，所以 ${B} 多出来的 ${s.onlyB.length} 个格子都安全。`;
  }
  if (!s.onlyB.length) {
    return `${B} 的未知格全都在 ${A} 的范围里。${A} 还需要 ${s.remA} 个雷，比 ${B} 多 ${d} 个，这些雷只能放在 ${A} 独有的 ${s.onlyA.length} 个格子里，正好放满，所以它们全是雷。`;
  }
  return `${A} 还需要 ${s.remA} 个雷，${B} 还需要 ${s.remB} 个，两者共享 ${s.shared} 个未知格。${A} 比 ${B} 多需要 ${d} 个雷，只能放在 ${A} 独有的格子里，而那里正好 ${s.onlyA.length} 格，所以全是雷；共享区因此承担了 ${B} 的全部 ${s.remB} 个雷，${B} 独有的 ${s.onlyB.length} 格都安全。`;
}

function metricsHTML(A, extra) {
  const items = [
    ['未知格', A.unknown.length],
    ['确定安全', A.safeAll.length],
    ['确定是雷', A.mineAll.length],
    ['计算耗时', A.ms < 1 ? '<1 ms' : Math.round(A.ms) + ' ms'],
  ];
  if (extra) items.splice(0, 1, extra);
  return `<dl class="metrics">${items.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
}

function buildHint(A) {
  const flagged = A.unknown.filter(i => S.st[i] === 2);
  const wrongFlags = flagged.filter(i => A.prob[i] === 0);
  const wrongNote = wrongFlags.length
    ? `<p class="note danger">注意：你在 ${wrongFlags.slice(0, 4).map(pos).join('、')}${wrongFlags.length > 4 ? ' 等处' : ''} 插的旗是错的，根据数字那里一定不是雷。</p>` : '';
  const approxNote = A.approx ? '<p class="note">有一片边界的可能布局太多，这一片的概率使用了近似估算。</p>' : '';

  if (A.contradiction) {
    return { tone: 'danger', pill: '异常', title: '盘面信息互相矛盾', html: '<p>当前数字找不到任何合法的布局，请开始新的一局。</p>', hl: null };
  }

  // 1) 规则推理能直接推出的安全格
  const si = A.steps.findIndex(s => s.safes.length);
  if (si >= 0) {
    const chain = chainFor(A, si), fin = A.steps[si];
    const chainMines = [...new Set(chain.flatMap(k => A.steps[k].mines))];
    const shown = chain.slice(-6);
    const li = shown.map(k => `<li data-step="${k}"${k === si ? ' class="final"' : ''}><span>${describeStep(A.steps[k])}</span></li>`).join('');
    const kindName = fin.kind === 'single' ? '单个数字' : '两数比较';
    const unflagged = chainMines.filter(j => S.st[j] !== 2).length;
    return {
      tone: 'safe', pill: '确定安全', title: `可以推出 ${fin.safes.length} 个安全格`,
      html: `<p>不用猜。${chain.length > 1 ? `需要 ${chain.length} 步推理` : `看一个${kindName === '单个数字' ? '数字' : '组合'}就够`}，橙框是用到的数字，绿圈是结论里的安全格${chainMines.length ? '，红圈是推理过程中确定的雷' : ''}。</p>
        ${chain.length > shown.length ? `<p class="hint-tip">（推理链较长，只列出最后 ${shown.length} 步）</p>` : ''}
        <ol class="chain">${li}</ol>
        <p class="hint-tip">把鼠标移到每一步上，棋盘会单独标出这一步用到的格子。${unflagged ? `红圈里有 ${unflagged} 个格子还没插旗，可以顺手插上。` : ''}</p>
        ${wrongNote}`,
      hl: { src: fin.srcs, safe: fin.safes, mine: chainMines },
      metrics: metricsHTML(A),
    };
  }

  // 2) 规则推不出，但枚举所有布局后某些格在每种布局里都安全
  if (A.enumSafe.length) {
    const front = A.enumSafe.filter(i => A.compOf[i] >= 0);
    if (front.length) {
      const ci = A.compOf[front[0]], comp = A.comps[ci];
      const safes = front.filter(i => A.compOf[i] === ci);
      const mines = A.enumMine.filter(i => A.compOf[i] === ci);
      return {
        tone: 'safe', pill: '确定安全', title: '需要把多个数字放在一起看',
        html: `<p>只看一个数字、或者两两比较都推不出新结论。把这片边界上的 ${comp.srcs.length} 个数字（橙框）联合起来，列出所有能同时满足它们的雷分布，共 <b>${fmtBig(comp.total)}</b> 种${A.fixedMines ? `（已扣除先推出的 ${A.fixedMines} 个雷）` : ''}，再按剩余雷数 ${A.M} 加权。</p>
          <p>绿圈的 ${safes.length} 个格子在每一种分布里都不是雷，所以 100% 安全。${mines.length ? `红圈的 ${mines.length} 个格子在每一种分布里都是雷。` : ''}</p>
          <p class="hint-tip">练习方法：试着在绿圈格子上假设“这里是雷”，顺着橙框数字推下去，会在某个数字上出现矛盾。</p>
          ${wrongNote}${approxNote}`,
        hl: { src: comp.srcs, safe: safes, mine: mines },
        metrics: metricsHTML(A, ['可能布局', fmtBig(comp.total)]),
      };
    }
    const inner = A.enumSafe.filter(i => A.compOf[i] < 0);
    return {
      tone: 'safe', pill: '确定安全', title: '剩余雷数说明内部全是空的',
      html: `<p>全盘共 ${A.total} 个雷，扣掉已确定的 ${A.fixedMines} 个后还剩 ${A.M} 个。而边界上的格子无论怎么排，都必须用掉这全部 ${A.M} 个雷，所以远离数字的 ${inner.length} 个内部格子都安全。</p>
        <p class="hint-tip">残局时一定要看左上角的剩余雷数，它常常能直接定生死。</p>${wrongNote}`,
      hl: { src: [], safe: inner, mine: [] },
      metrics: metricsHTML(A),
    };
  }

  // 3) 必须猜：给出风险最低的格子
  const nb = nbr();
  const cand = A.unknown.filter(i => A.prob[i] < 1).sort((a, b) => A.prob[a] - A.prob[b]);
  if (!cand.length) return { tone: 'info', pill: '提示', title: '剩下的都是雷', html: '<p>所有未翻开的格子都是雷，把它们插上旗即可。</p>', hl: null };
  const minP = A.prob[cand[0]];
  const ties = cand.filter(i => A.prob[i] <= minP + 0.005);
  const unkN = i => nb[i].filter(j => S.st[j] !== 1).length;
  ties.sort((a, b) => unkN(a) - unkN(b) || A.prob[a] - A.prob[b]);
  const g = ties[0], inner = A.compOf[g] < 0;
  const front = cand.filter(i => A.compOf[i] >= 0);
  const bestFront = front.length ? A.prob[front[0]] : NaN;
  let why;
  if (inner) {
    why = `它不挨着任何数字。内部格子的雷率是 ${pct(A.pOther)}${front.length ? `，比边界上最安全的候选（${pct(bestFront)}）还低` : ''}。同样风险下优先选角落或贴边的格子：周围格子少，更容易翻出 0 打开一片。`;
  } else {
    why = `它挨着数字，在大多数可能的布局里都不是雷${A.nO ? `；作为对比，远离数字的内部格雷率是 ${pct(A.pOther)}` : ''}。翻开后会得到一个新数字，帮你继续推进这一片。`;
  }
  const unflaggedMines = A.mineAll.filter(i => S.st[i] !== 2).length;
  return {
    tone: 'guess', pill: '必须猜测', title: `最低风险 ${pct(minP)}`,
    html: `<p>当前没有任何格子能 100% 确定安全，只能猜。下面的概率是：在所有符合当前数字和剩余雷数的布局里，这个格子是雷的比例。</p>
      <p>风险最低的是虚线框的格子 ${pos(g)}，雷率 <b>${pct(minP)}</b>。${why}</p>
      ${ties.length > 1 ? `<p class="hint-tip">另有 ${ties.length - 1} 个格子风险几乎相同。</p>` : ''}
      ${unflaggedMines ? `<p class="hint-tip">另外有 ${unflaggedMines} 个格子已确定是雷还没插旗（概率图里显示 100）。</p>` : ''}
      <p class="hint-tip">打开「概率图」对比每个格子的数值，试着自己说出为什么这里最低。</p>
      ${wrongNote}${approxNote}`,
    hl: { src: [], safe: wrongFlags, mine: [], guess: [g] },
    metrics: metricsHTML(A, ['最低雷率', pct(minP)]),
  };
}

/* 提示按钮是开关：第一次点展开提示，再点一次恢复到点提示之前的页面 */
function hint() {
  if (S.hintOpen) { closeHint(); return; }
  const prev = S.card;
  if (S.state === 'ready') {
    setCard({ tone: 'info', pill: '开局', title: '第一下点哪里都安全', html: '<p>本游戏保证第一次点击的格子和它周围 8 格都没有雷，所以第一步没有风险。点在中间区域，更容易一次翻开一大片。</p>' });
  } else if (S.state !== 'playing') {
    setCard({ tone: 'info', pill: '提示', title: '这一局已经结束', html: '<p>点「新局」或按 N 再来一局。</p>' });
  } else {
    S.hints++;
    const H = buildHint(getAnalysis());
    S.hl = H.hl; S.hlTemp = null;
    setCard(H);
  }
  S.hintOpen = true; S.preCard = prev;
  renderBoard(); renderStatus();
}
function closeHint() {
  S.hintOpen = false; S.hl = null; S.hlTemp = null;
  unlocate();
  setCard(S.preCard || defaultCard());
  S.preCard = null;
  renderBoard(); renderStatus();
}

function defaultCard() {
  return {
    tone: 'info', pill: '分析台', title: '卡住时点「提示」',
    html: `<ul>
      <li>提示会先找能严格推出的安全格，并按步骤写出推理过程，鼠标移到每一步上会在棋盘里标出对应格子。</li>
      <li>推不出时，它会算出每个格子是雷的概率，告诉你风险最低的位置和原因。</li>
      <li>坐标写作「行,列」，对应棋盘左侧和上方的数字。提示里的坐标格（例如 ${pos(Math.floor(S.rows / 2) * S.cols + Math.floor(S.cols / 2))}）可以悬停或点击，棋盘上会标出它的位置。</li>
      <li>求解器只读取你屏幕上看得到的数字和总雷数，不读取雷的真实位置，也不相信你插的旗。</li>
      <li>「实时教练」会在你每一步之后告诉你：这一步是确定安全、最优猜测，还是不必要的冒险。</li>
    </ul>`,
  };
}

/* ==========================================================================
   Rendering
   ========================================================================== */
function buildBoard() {
  const b = $('#board'), field = $('#field');
  field.style.setProperty('--cols', S.cols);
  field.style.setProperty('--rows', S.rows);
  const N = S.rows * S.cols;
  let html = '';
  for (let i = 0; i < N; i++) html += `<div class="cell" data-i="${i}"></div>`;
  b.innerHTML = html;
  els = [...b.children];
  keys = new Array(N).fill('');
  // 定位用的覆盖层（行带、列带、定位框），放在格子之后，不影响格子下标
  b.insertAdjacentHTML('beforeend', '<div class="xband row" hidden></div><div class="xband col" hidden></div><div class="locator" hidden></div>');
  const lbl = n => `<span${n % 5 === 0 ? ' class="five"' : ''}>${n}</span>`;
  $('#axisX').innerHTML = Array.from({ length: S.cols }, (_, k) => lbl(k + 1)).join('');
  $('#axisY').innerHTML = Array.from({ length: S.rows }, (_, k) => lbl(k + 1)).join('');
  b.setAttribute('aria-label', `${S.rows} 行 ${S.cols} 列，${S.mines} 个雷`);
  sizeBoard();
}
function sizeBoard() {
  const wrap = $('#boardWrap'), field = $('#field');
  const gap = S.cols > 20 ? 3 : 4;
  const w = wrap.clientWidth - 22 - 24;
  const cw = Math.floor((w - (S.cols - 1) * gap) / S.cols);
  const ch = Math.floor((window.innerHeight - 274 - (S.rows - 1) * gap) / S.rows);
  const cell = Math.max(24, Math.min(cw, Math.max(ch, 28), 46));
  field.style.setProperty('--cell', cell + 'px');
  field.style.setProperty('--gap', gap + 'px');
}

/* ---------- 坐标定位：提示里的坐标格 ↔ 棋盘 ---------- */
let locTimer = 0;
function axisMark(r, c, cls) {
  document.querySelectorAll(`.axis span.${cls}`).forEach(s => s.classList.remove(cls));
  if (r == null) return;
  const x = $('#axisX').children[c - 1], y = $('#axisY').children[r - 1];
  if (x) x.classList.add(cls);
  if (y) y.classList.add(cls);
}
function locate(i, opt = {}) {
  if (!(i >= 0 && i < S.rows * S.cols)) return;
  clearTimeout(locTimer);
  const b = $('#board'), [r, c] = rc(i);
  const row = b.querySelector('.xband.row'), col = b.querySelector('.xband.col'), loc = b.querySelector('.locator');
  for (const el of [row, col, loc]) { el.style.setProperty('--r', r - 1); el.style.setProperty('--c', c - 1); el.hidden = false; }
  loc.dataset.label = `第${r}行 · 第${c}列`;
  loc.classList.toggle('below', r <= 2);
  axisMark(r, c, 'on');
  document.querySelectorAll('.coord.on').forEach(x => x.classList.remove('on'));
  document.querySelectorAll(`.coord[data-cell="${i}"]`).forEach(x => x.classList.add('on'));
  if (opt.scroll) {
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    els[i].scrollIntoView({ block: 'nearest', inline: 'center', behavior: reduce ? 'auto' : 'smooth' });
  }
  if (opt.hold) locTimer = setTimeout(unlocate, opt.hold);
}
function unlocate() {
  clearTimeout(locTimer);
  document.querySelectorAll('#board .xband, #board .locator').forEach(el => { el.hidden = true; });
  axisMark(null, null, 'on');
  document.querySelectorAll('.coord.on').forEach(x => x.classList.remove('on'));
}
function bindCoords(root) {
  const chip = e => e.target.closest && e.target.closest('.coord[data-cell]');
  root.addEventListener('mouseover', e => { const c = chip(e); if (c) locate(+c.dataset.cell); });
  root.addEventListener('mouseout', e => { const c = chip(e); if (c && !c.contains(e.relatedTarget)) unlocate(); });
  root.addEventListener('focusin', e => { const c = chip(e); if (c) locate(+c.dataset.cell); });
  root.addEventListener('focusout', e => { if (chip(e)) unlocate(); });
  root.addEventListener('click', e => { const c = chip(e); if (c) { e.preventDefault(); locate(+c.dataset.cell, { scroll: true, hold: 2200 }); } });
}

function hlCodes() {
  const hl = S.hlTemp || S.hl;
  if (!hl) return null;
  const m = new Map();
  (hl.src || []).forEach(i => m.set(i, 'hl-src'));
  (hl.mine || []).forEach(i => m.set(i, 'hl-mine'));
  (hl.guess || []).forEach(i => m.set(i, 'hl-guess'));
  (hl.safe || []).forEach(i => m.set(i, 'hl-safe'));
  return m;
}

function renderBoard() {
  const playing = S.state === 'playing';
  const A = S.heat && playing ? getAnalysis() : null;
  const hl = hlCodes();
  const N = S.rows * S.cols;
  for (let i = 0; i < N; i++) {
    const st = S.st[i];
    let cls = 'cell', html = '', p = null;
    if (st === 1) {
      cls += ' r';
      if (S.adj[i]) { cls += ' n' + S.adj[i]; html = S.adj[i]; }
    } else if (S.state === 'lost' && S.mine[i] && st !== 2 && (S.revealAll || S.booms.includes(i))) {
      cls += ' m'; html = MINE_SVG;
      if (S.booms.includes(i)) cls += ' boom';
    } else {
      cls += ' h';
      if (st === 2) {
        cls += ' f'; html = FLAG_SVG;
        if (S.seen.has(i)) cls += ' seen';
        if (S.state === 'lost' && S.revealAll && !S.mine[i]) cls += ' wrong';
      } else if (A && !A.contradiction) {
        p = A.prob[i];
        cls += ' heat';
        const v = Math.round(p * 100);
        html = `<span class="pct">${p > 0 && v === 0 ? '<1' : p < 1 && v === 100 ? '99' : v}</span>`;
      }
    }
    if (hl && hl.has(i) && playing) cls += ' ' + hl.get(i);
    const key = cls + '|' + html + '|' + p;
    if (keys[i] === key) continue;
    keys[i] = key;
    const el = els[i];
    if (delays.has(i)) el.style.setProperty('--d', delays.get(i) + 'ms');
    else if (st !== 1) el.style.removeProperty('--d');
    el.className = cls;
    el.innerHTML = html;
    if (p != null) el.style.setProperty('--p', p.toFixed(3)); else el.style.removeProperty('--p');
  }
  delays.clear();
}

function renderTimer() {
  $('#timer').textContent = String(Math.min(999, Math.floor(S.elapsed))).padStart(3, '0');
}
function renderStatus() {
  const left = S.mines - S.flags;
  const mc = $('#mineCount');
  mc.textContent = (left < 0 ? '-' + String(-left).padStart(2, '0') : String(left).padStart(3, '0'));
  mc.classList.toggle('warn', left < 0);
  renderTimer();
  const nb = $('#newBtn');
  nb.dataset.state = S.state;
  $('#face').innerHTML = FACE[S.state];
  $('#heatBtn').setAttribute('aria-pressed', S.heat);
  const hb = $('#hintBtn');
  hb.setAttribute('aria-pressed', S.hintOpen);
  hb.innerHTML = (S.hintOpen ? '收起提示' : '提示') + ' <kbd>H</kbd>';
  $('#legend').hidden = !S.heat;
  $('#flagModeBtn').setAttribute('aria-pressed', S.flagMode);
  $('#coachToggle').checked = S.coach;
  document.querySelectorAll('#diffSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.diff === S.diff));
}

function setCard(c) {
  S.card = c;
  const el = $('#analysis');
  el.innerHTML = `<div class="verdict tone-${c.tone}"><span class="pill">${c.pill}</span><span class="vt">${c.title}</span></div>
    <div class="prose">${c.html}</div>${c.metrics || ''}`;
  el.querySelectorAll('.chain li[data-step]').forEach(li => {
    const k = +li.dataset.step;
    li.addEventListener('mouseenter', () => {
      const A = S.analysis; if (!A || !A.steps[k]) return;
      const s = A.steps[k];
      S.hlTemp = { src: s.srcs, safe: s.safes, mine: s.mines };
      renderBoard();
    });
    li.addEventListener('mouseleave', () => { S.hlTemp = null; renderBoard(); });
  });
}

const KIND = {
  first:  ['开局', ''],
  safe:   ['确定安全', 'safe'],
  forced: ['最优猜测', 'warn'],
  subopt: ['可以更稳', 'orange'],
  risky:  ['不必要的冒险', 'danger'],
  na:     ['—', ''],
  undone: ['踩雷 · 已返回', 'danger'],
};
function renderLog() {
  const counts = { safe: 0, forced: 0, subopt: 0, risky: 0 };
  S.log.forEach(e => { if (e.kind in counts) counts[e.kind]++; });
  $('#summary').innerHTML = ['safe', 'forced', 'subopt', 'risky']
    .map(k => `<span class="chip"><span class="dot ${KIND[k][1]}"></span>${KIND[k][0]} <b>${counts[k]}</b></span>`).join('');
  const rows = S.log.slice(-60).reverse().map(e => `<li>
      <span class="i">#${e.n}</span>
      <span class="c">${pos(e.cell)}</span>
      <span class="p">${e.kind === 'first' ? '0%' : pct(e.p)}</span>
      <span class="k" title="${e.undone ? `当时评价：${KIND[e.kind][0]}` : ''}"><span class="dot ${KIND[e.undone ? 'undone' : e.kind][1]}"></span>${KIND[e.undone ? 'undone' : e.kind][0]}</span>
    </li>`).join('');
  $('#log').innerHTML = rows || '';
  if (!rows) $('#log').innerHTML = '<li style="grid-template-columns:1fr;background:none"><p class="empty">开始翻格子后，这里会记录每一步当时的雷率和评价。</p></li>';
}

function renderStats() {
  const st = LS.get(statsKey(), { played: 0, won: 0, best: null });
  $('#statsName').textContent = S.diff === 'custom' ? `自定义 ${S.cols}×${S.rows}·${S.mines}` : PRESETS[S.diff].name;
  $('#stats').innerHTML = `
    <div><dt>最佳用时</dt><dd>${st.best != null ? st.best.toFixed(1) + 's' : '—'}</dd></div>
    <div><dt>胜场 / 总局</dt><dd>${st.won} / ${st.played}</dd></div>
    <div><dt>胜率</dt><dd>${st.played ? Math.round(st.won / st.played * 100) + '%' : '—'}</dd></div>`;
}

function renderAll() { renderBoard(); renderStatus(); renderLog(); renderStats(); }

/* ---------- coach toast ---------- */
function coachToast(ev) {
  let tone, tag, msg;
  if (ev.kind === 'risky') { tone = 'danger'; tag = '冒险'; msg = `这一步雷率 ${pct(ev.p)}。当时盘面上有 ${ev.safeN} 个 100% 安全的格子，应该先翻它们。按 H 看看在哪。`; }
  else if (ev.kind === 'subopt') { tone = 'orange'; tag = '可以更稳'; msg = `这一步雷率 ${pct(ev.p)}，而当时最低风险的格子只有 ${pct(ev.minP)}。按 M 打开概率图对比一下。`; }
  else if (ev.kind === 'forced') { tone = 'warn'; tag = '最优猜测'; msg = `没有确定安全的格子，这次猜测雷率 ${pct(ev.p)}，已经是最低风险的选择。`; }
  else { clearToast(); return; }
  const slot = $('#toastSlot');
  slot.innerHTML = `<div class="toast ${tone}"><span class="tag">${tag}</span><span>${msg}</span></div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(clearToast, 7000);
}
function clearToast() { clearTimeout(toastTimer); const s = $('#toastSlot'); if (s) s.innerHTML = ''; }

/* ---------- result overlay ---------- */
function showResult(type, isBest) {
  const counts = { safe: 0, guess: 0 };
  S.log.forEach(e => { if (e.kind === 'safe') counts.safe++; else if (e.kind !== 'first' && e.kind !== 'na') counts.guess++; });
  const card = $('#resultCard');
  card.className = 'result-card ' + type;
  const ev = S.lastEval;
  card.innerHTML = type === 'win'
    ? `<p class="eyebrow">通关 · ${S.diff === 'custom' ? '自定义' : PRESETS[S.diff].name}</p>
       <h2>${S.elapsed.toFixed(1)} 秒</h2>
       ${isBest ? '<span class="badge-new">新纪录</span>' : ''}
       <p>每一步都没踩雷。下面是你这局的决策构成。</p>`
    : `<p class="eyebrow">踩雷 · 第 ${S.log.length} 步</p>
       <h2>${ev && ev.kind === 'risky' ? '这一步本可以避开' : ev && ev.kind === 'subopt' ? '有更稳的选择' : ev && ev.kind === 'forced' ? '运气不站你这边' : '踩到雷了'}</h2>
       <p>${loseReview(ev)}</p>`;
  card.innerHTML += `
    <dl class="result-stats">
      <div><dt>推理步</dt><dd>${counts.safe}</dd></div>
      <div><dt>猜测步</dt><dd>${counts.guess}</dd></div>
      <div><dt>用提示</dt><dd>${S.hints}</dd></div>
      ${S.undos ? `<div><dt>返回</dt><dd>${S.undos}</dd></div>` : ''}
    </dl>
    ${type === 'win' && S.undos ? '<p>这局用过「返回上一步」，不计入最佳用时。</p>' : ''}
    <div class="row">
      ${type === 'lose' && canUndo()
        ? `<button type="button" class="btn primary" data-act="undo">返回上一步 <kbd>Z</kbd></button>
           <button type="button" class="btn" data-act="again">再来一局</button>
           <button type="button" class="linkish" data-act="view">先看看棋盘</button>`
        : `<button type="button" class="btn primary" data-act="again">再来一局</button>
           <button type="button" class="btn" data-act="view">查看棋盘</button>`}
    </div>`;
  $('#result').hidden = false;
}
function hideResult() { $('#result').hidden = true; }

/* ---------- confetti ---------- */
function confetti() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const stage = $('#stage');
  const cv = document.createElement('canvas'); cv.className = 'confetti';
  stage.appendChild(cv);
  const dpr = window.devicePixelRatio || 1, W = stage.clientWidth, H = stage.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const colors = ['--accent', '--safe', '--n1', '--n4', '--warn', '--n6'].map(v => cs.getPropertyValue(v).trim());
  const P = Array.from({ length: 140 }, () => ({
    x: W / 2 + (Math.random() - .5) * 80, y: H * .45,
    vx: (Math.random() - .5) * 12, vy: -Math.random() * 13 - 4,
    w: 5 + Math.random() * 6, h: 3 + Math.random() * 4, r: Math.random() * 6, vr: (Math.random() - .5) * .4,
    c: colors[Math.floor(Math.random() * colors.length)],
  }));
  const t0 = performance.now();
  (function frame(t) {
    const life = (t - t0) / 2600;
    ctx.clearRect(0, 0, W, H);
    for (const p of P) {
      p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.globalAlpha = Math.max(0, 1 - life); ctx.fillStyle = p.c;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    }
    if (life < 1) requestAnimationFrame(frame); else cv.remove();
  })(t0);
}

/* ---------- pattern cheat sheet ---------- */
const PATTERNS = [
  { name: '1-2-1', top: 'SMSMS', bot: '.121.', text: '贴着一排未知格出现 1-2-1：雷在两个 1 的正上方，中间和两端都安全。' },
  { name: '1-2-2-1', top: 'SSMMSS', bot: '.1221.', text: '雷在两个 2 的正上方，其余全部安全。' },
  { name: '1-2', top: 'S??M', bot: '.12.', text: '2 要两颗雷，和 1 共享的两格最多一颗，所以 2 独有的那格是雷，1 独有的那格安全。' },
  { name: '靠墙 1-1', top: '??S', bot: '11.', wall: true, text: '第一个 1 的雷在左边两格里，第二个 1 也看得到这两格，所以它右上方那格安全。' },
];
function renderPatterns() {
  $('#patterns').innerHTML = PATTERNS.map(p => {
    const cells = [...p.top].map(ch => `<div class="cell h ${ch === 'S' ? 'hl-safe' : ch === 'M' ? 'hl-mine' : ''}"></div>`).join('')
      + [...p.bot].map(ch => ch === '.' ? '<div class="cell dim"></div>' : `<div class="cell r n${ch}" style="animation:none">${ch}</div>`).join('');
    return `<div class="pattern"><h4>${p.name}</h4><div class="pgrid${p.wall ? ' wall' : ''}" style="--cols:${p.top.length}">${cells}</div><p>${p.text}</p></div>`;
  }).join('');
}

/* ==========================================================================
   Input
   ========================================================================== */
function bindInput() {
  const b = $('#board');
  let lp = null, lastPointer = 'mouse';
  const idx = e => { const c = e.target.closest('.cell'); return c ? +c.dataset.i : -1; };

  b.addEventListener('pointerdown', e => {
    lastPointer = e.pointerType;
    const i = idx(e); if (i < 0) return;
    if (e.button === 1) { e.preventDefault(); chord(i); return; }
    if (e.pointerType === 'touch') {
      lp = { i, x: e.clientX, y: e.clientY, fired: false };
      lp.t = setTimeout(() => {
        if (!lp) return;
        lp.fired = true;
        if (S.st[i] === 1) chord(i); else toggleFlag(i);
        if (navigator.vibrate) try { navigator.vibrate(12); } catch {}
      }, 380);
    }
  });
  b.addEventListener('pointermove', e => {
    if (lp && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 10) { clearTimeout(lp.t); lp = null; }
  });
  const endLP = () => { if (lp) clearTimeout(lp.t); };
  b.addEventListener('pointerup', endLP);
  b.addEventListener('pointercancel', () => { endLP(); lp = null; });
  b.addEventListener('click', e => {
    const i = idx(e); if (i < 0) return;
    if (lp && lp.fired && lp.i === i) { lp = null; return; }
    lp = null;
    if (S.st[i] === 1) { chord(i); return; }
    if (S.flagMode) toggleFlag(i);
    else if (S.st[i] === 0) reveal(i);
  });
  b.addEventListener('contextmenu', e => {
    e.preventDefault();
    if (lastPointer === 'touch') return;
    const i = idx(e); if (i >= 0) toggleFlag(i);
  });
  // 鼠标在棋盘上移动时，坐标轴上对应的行号、列号跟着亮起
  b.addEventListener('pointerover', e => {
    if (e.pointerType === 'touch') return;
    const i = idx(e); if (i < 0) return;
    const [r, c] = rc(i); axisMark(r, c, 'hover');
  });
  b.addEventListener('pointerleave', () => axisMark(null, null, 'hover'));
  bindCoords($('#analysis'));
  bindCoords($('#log'));

  $('#newBtn').addEventListener('click', () => newGame());
  $('#hintBtn').addEventListener('click', hint);
  $('#heatBtn').addEventListener('click', toggleHeat);
  $('#flagModeBtn').addEventListener('click', () => { S.flagMode = !S.flagMode; renderStatus(); });
  $('#coachToggle').addEventListener('change', e => { S.coach = e.target.checked; LS.set('ms-coach', S.coach); if (!S.coach) clearToast(); });
  $('#diffSeg').addEventListener('click', e => {
    const btn = e.target.closest('button'); if (!btn) return;
    const d = btn.dataset.diff;
    if (d === 'custom') {
      const f = $('#customForm');
      f.hidden = !f.hidden;
      $('#cRows').value = S.custom.rows; $('#cCols').value = S.custom.cols; $('#cMines').value = S.custom.mines;
      return;
    }
    $('#customForm').hidden = true;
    newGame(d);
  });
  $('#customForm').addEventListener('submit', e => {
    e.preventDefault();
    const rows = Math.round(+$('#cRows').value), cols = Math.round(+$('#cCols').value), mines = Math.round(+$('#cMines').value);
    const msg = $('#customMsg');
    if (!(rows >= 5 && rows <= 30 && cols >= 5 && cols <= 40)) { msg.textContent = '行数要在 5–30 之间，列数要在 5–40 之间。'; return; }
    if (!(mines >= 1 && mines <= rows * cols - 9)) { msg.textContent = `雷数要在 1–${rows * cols - 9} 之间（首击周围 9 格保证无雷）。`; return; }
    msg.textContent = '行 5–30，列 5–40，雷数至少比格子总数少 9 个。';
    S.custom = { rows, cols, mines }; LS.set('ms-custom', S.custom);
    $('#customForm').hidden = true;
    newGame('custom', S.custom);
  });
  // 结算卡片和分析台里的操作按钮
  document.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('#resultCard [data-act], #analysis [data-act]'); if (!a) return;
    const act = a.dataset.act;
    if (act === 'again') newGame();
    else if (act === 'undo') undo();
    else if (act === 'reveal') revealMines();
    else if (act === 'view') hideResult();
  });
  $('#themeBtn').addEventListener('click', cycleTheme);

  document.addEventListener('keydown', e => {
    if ((e.target.closest && e.target.closest('input,textarea')) || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'h') hint();
    else if (k === 'm') toggleHeat();
    else if (k === 'n') newGame();
    else if (k === 'f') { S.flagMode = !S.flagMode; renderStatus(); }
    else if (k === 'z') undo();
    else if (k === 'escape') hideResult();
  });
  let rt = 0;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(sizeBoard, 80); });
}

function toggleHeat() {
  S.heat = !S.heat;
  renderBoard(); renderStatus();
}

const THEMES = [['auto', '跟随系统'], ['light', '浅色'], ['dark', '深色']];
function applyTheme(t) {
  if (t === 'auto') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = t;
  $('#themeLabel').textContent = THEMES.find(x => x[0] === t)[1];
}
function cycleTheme() {
  const cur = document.documentElement.dataset.theme || 'auto';
  const next = THEMES[(THEMES.findIndex(x => x[0] === cur) + 1) % THEMES.length][0];
  applyTheme(next); LS.set('ms-theme', next);
}

/* ---------- boot (with hot-reload state handoff) ---------- */
function serialize() {
  return {
    diff: S.diff, rows: S.rows, cols: S.cols, mines: S.mines,
    mine: Array.from(S.mine || []), adj: Array.from(S.adj || []), st: Array.from(S.st || []),
    state: S.state, revealed: S.revealed, flags: S.flags, elapsed: S.elapsed, hints: S.hints,
    heat: S.heat, log: S.log, explodedAt: S.explodedAt, lastEval: S.lastEval,
    booms: S.booms, seen: [...S.seen], revealAll: S.revealAll, undos: S.undos,
    prev: S.prev && { ...S.prev, st: Array.from(S.prev.st) },
  };
}
function start(data) {
  applyTheme(LS.get('ms-theme', 'auto'));
  renderPatterns();
  bindInput();
  const g = data && data.game;
  if (g && g.st && g.st.length === g.rows * g.cols) {
    Object.assign(S, {
      diff: g.diff, rows: g.rows, cols: g.cols, mines: g.mines,
      mine: Uint8Array.from(g.mine), adj: Uint8Array.from(g.adj), st: Uint8Array.from(g.st),
      state: g.state, revealed: g.revealed, flags: g.flags, elapsed: g.elapsed, hints: g.hints,
      heat: g.heat, log: g.log || [], explodedAt: g.explodedAt, lastEval: g.lastEval,
      booms: g.booms || (g.explodedAt >= 0 ? [g.explodedAt] : []), seen: new Set(g.seen || []),
      revealAll: g.revealAll ?? true, undos: g.undos || 0,
      prev: g.prev ? { ...g.prev, st: Uint8Array.from(g.prev.st) } : null,
    });
    S.ver++;
    buildBoard(); setCard(S.state === 'lost' ? loseCard() : defaultCard()); renderAll();
    if (S.state === 'playing') startTimer();
  } else {
    const d = LS.get('ms-diff', 'medium');
    newGame(PRESETS[d] || d === 'custom' ? d : 'medium');
  }
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
    window.claude.hot.snapshot(() => ({ game: serialize() }));
  }
}
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
